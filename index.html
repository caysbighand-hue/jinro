<!doctype html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><style>
:root{--n:#173b6c;--b:#2878d0;--bg:#eef3f8;--r:#c62828;--g:#13713d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Noto Sans KR',sans-serif;color:#172033}.wrap{max-width:1400px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;background:var(--n);color:#fff;padding:20px 24px;border-radius:16px}h1{margin:0}.card{background:#fff;border-radius:14px;padding:18px;margin-top:15px;box-shadow:0 3px 14px #173b6c14}.login{max-width:420px;margin:70px auto}.login input{letter-spacing:5px}.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.metric{background:#fff;border-radius:14px;padding:18px;border:0;border-top:5px solid var(--b);box-shadow:0 3px 14px #173b6c14;color:#172033;text-align:left}.metric:hover,.metric.active{outline:3px solid #2878d055}.metric strong{display:block;font-size:30px;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{width:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #dde3ea;text-align:left;vertical-align:top}th{background:#f3f6fa;position:sticky;top:0}.status{font-weight:800}.대기{color:#a15d00}.승인{color:#175cab}.보류{color:#7b3fb0}.완료{color:var(--g)}.반려{color:var(--r)}button,input,select,textarea{font:inherit;border-radius:8px}button{border:0;background:var(--n);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}button.alt{background:#596677}button:disabled{opacity:.5}input,select,textarea{border:1px solid #b8c3d0;padding:10px}.pager{display:flex;justify-content:center;gap:8px;margin-top:15px}.pager button{width:auto}.modal{display:none;position:fixed;inset:0;background:#0008;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:min(600px,100%);background:#fff;border-radius:15px;padding:20px}.dialog textarea{width:100%;min-height:160px}.statsTable{min-width:700px}@media(max-width:800px){.dash{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column;gap:10px}}</style></head><body><main class="wrap"><section id="login" class="card login"><h2>🔐 상담교사 로그인</h2><label>관리자 비밀번호</label><input id="pin" type="password" inputmode="numeric" maxlength="6" style="width:100%;margin-top:8px"><button style="width:100%;margin-top:12px" onclick="login()">로그인</button><p id="loginMsg" style="color:#c62828"></p></section><section id="app" hidden><header><h1>📊 진로상담 관리</h1><button class="alt" onclick="loadData()">새로고침</button></header><div class="dash"><button class="metric" data-view="today" onclick="setDashboardView('today')">오늘 상담<strong id="mToday">0</strong></button><button class="metric" data-view="week" onclick="setDashboardView('week')">이번 주 상담<strong id="mWeek">0</strong></button><button class="metric" data-view="pending" onclick="setDashboardView('pending')">미승인 상담<strong id="mPending">0</strong></button><button class="metric" data-view="completed" onclick="setDashboardView('completed')">완료 상담<strong id="mDone">0</strong></button></div><section class="card"><div class="toolbar"><strong id="listTitle">신청 목록</strong><button class="alt" onclick="setDashboardView('')">전체 보기</button><select id="filter" onchange="page=1;render()"><option value="">전체 상태</option><option>대기</option><option>승인</option><option>보류</option><option>완료</option><option>반려</option></select><button onclick="sortBy('datetime')">상담일시 ↕</button><button onclick="sortBy('name')">학생이름 ↕</button><button onclick="sortBy('studentId')">학번 ↕</button></div><div class="tablewrap"><table id="adminTable"><thead><tr><th>상담일시</th><th>학생이름</th><th>학번</th><th>분야</th><th>상태</th><th>신청내용</th><th>관리</th></tr></thead><tbody></tbody></table></div><div id="pager" class="pager"></div></section><section class="card"><h2>월별 상담통계</h2><div class="tablewrap"><table class="statsTable"><thead><tr><th>월</th><th>전체</th><th>진학</th><th>취업</th><th>진로탐색</th><th>학과/전공</th><th>기타</th><th>완료</th></tr></thead><tbody id="statsBody"></tbody></table></div></section></section></main><div id="modal" class="modal"><div class="dialog"><h2>상담 기록</h2><p id="studentInfo"></p><label>상태</label><select id="editStatus" style="width:100%;margin:7px 0 14px"></select><label>상담 결과</label><textarea id="editResult" maxlength="3000"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="alt" onclick="closeModal()">닫기</button><button onclick="saveEdit()">저장</button></div></div></div><script>
let token='',rows=[],monthly=[],page=1,sort={key:'datetime',dir:1},editing=null,dashboardView='';let notificationEnabled=false,notificationTimer=null,audioContext=null;const knownApplicationIds=new Set();const size=15,$=id=>document.getElementById(id);function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
document.head.insertAdjacentHTML('beforeend',`<style>@media(max-width:700px){.wrap{padding:10px}header{border-radius:12px;padding:16px}.dash{grid-template-columns:repeat(2,1fr);gap:8px}.metric{padding:13px}.metric strong{font-size:25px}.toolbar{align-items:stretch}.toolbar strong{width:100%}.toolbar select,.toolbar button{flex:1;min-width:120px}#adminTable{min-width:0}#adminTable thead{display:none}#adminTable,#adminTable tbody,#adminTable tr,#adminTable td{display:block;width:100%}#adminTable tr{background:#fff;border:1px solid #d8e0e9;border-radius:13px;padding:10px;margin-bottom:12px;box-shadow:0 2px 8px #173b6c12}#adminTable td{display:grid;grid-template-columns:88px 1fr;gap:8px;border:0;border-bottom:1px solid #edf0f4;padding:9px 5px;overflow-wrap:anywhere}#adminTable td:last-child{border-bottom:0}#adminTable td::before{content:attr(data-label);font-weight:800;color:#536173}#adminTable td:last-child button{width:100%;min-height:44px}.card{padding:13px}.pager{align-items:center}.statsTable{min-width:700px}}</style>`);
document.head.insertAdjacentHTML('beforeend','<style>.status-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.approve-btn,.hold-btn{margin:0;padding:7px 10px;font-size:13px;white-space:nowrap}.approve-btn{background:#176b3a}.approve-btn:hover{background:#0f542d}.hold-btn{background:#7b3fb0}.hold-btn:hover{background:#5e2e89}@media(max-width:700px){.status-box{justify-content:flex-start}.approve-btn,.hold-btn{min-height:42px;min-width:90px}}</style>');
document.head.insertAdjacentHTML('beforeend','<style>#notificationButton{background:#f2b705;color:#172033}#notificationButton.on{background:#28a05a;color:#fff}.new-application-toast{position:fixed;right:22px;top:22px;z-index:9999;width:min(380px,calc(100% - 30px));background:#fff;border-left:7px solid #2878d0;border-radius:13px;padding:17px 45px 17px 17px;box-shadow:0 10px 35px #0004}.new-application-toast strong{display:block;font-size:18px;margin-bottom:7px}.new-application-toast button{position:absolute;right:8px;top:6px;background:transparent;color:#333;font-size:22px;padding:5px}@media(max-width:700px){.new-application-toast{right:15px;top:15px}}</style>');
document.querySelector('header button').insertAdjacentHTML('afterend','<button id="notificationButton" type="button" onclick="enableNewApplicationAlerts()" disabled>🔔 신규 신청 알림 켜기</button>');
document.querySelector('#login h2').textContent='천안여자상업고등학교 진로상담실';
function login(){google.script.run.withSuccessHandler(r=>{if(!r.ok)return $('loginMsg').textContent=r.message;token=r.token;$('login').hidden=true;$('app').hidden=false;loadData()}).adminLogin($('pin').value)}
function loadData(silent=false){google.script.run.withSuccessHandler(d=>{if(notificationEnabled)detectNewApplications(d.rows);rows=d.rows;monthly=d.monthly;$('mToday').textContent=d.stats.today;$('mWeek').textContent=d.stats.week;$('mPending').textContent=d.stats.pending;$('mDone').textContent=d.stats.completed;$('editStatus').innerHTML=d.statuses.map(x=>`<option>${x}</option>`).join('');$('notificationButton').disabled=false;render();renderStats()}).withFailureHandler(e=>{if(!silent)alert(e.message)}).getAdminData(token)}
async function enableNewApplicationAlerts(){
  if(notificationEnabled)return;
  try{audioContext=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume()}catch(e){audioContext=null}
  if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  knownApplicationIds.clear();rows.forEach(r=>knownApplicationIds.add(r.id));
  notificationEnabled=true;$('notificationButton').textContent='🔔 신규 신청 알림 켜짐';$('notificationButton').classList.add('on');
  notificationTimer=setInterval(()=>loadData(true),30000);
  showApplicationToast('알림이 켜졌습니다.','이후 접수되는 신규 상담 신청을 30초마다 확인합니다.');playAlertSound();
}
function detectNewApplications(incoming){
  const added=incoming.filter(r=>r.id&&!knownApplicationIds.has(r.id));
  incoming.forEach(r=>{if(r.id)knownApplicationIds.add(r.id)});
  added.reverse().forEach(r=>{const detail=`${r.name} 학생 · ${r.date} ${r.time}`;showApplicationToast('새 진로상담 신청',detail);playAlertSound();if('Notification'in window&&Notification.permission==='granted'){try{new Notification('새 진로상담 신청',{body:detail,tag:'career-'+r.id})}catch(e){}}});
}
function showApplicationToast(title,detail){document.querySelectorAll('.new-application-toast').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',`<aside class="new-application-toast" role="alert"><button type="button" aria-label="닫기" onclick="this.parentElement.remove()">×</button><strong>${esc(title)}</strong><div>${esc(detail)}</div></aside>`)}
function playAlertSound(){if(!audioContext)return;try{const now=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.frequency.setValueAtTime(880,now);osc.frequency.setValueAtTime(1175,now+.16);gain.gain.setValueAtTime(.14,now);gain.gain.exponentialRampToValueAtTime(.001,now+.38);osc.start(now);osc.stop(now+.4)}catch(e){}}
function sortBy(key){if(sort.key===key)sort.dir*=-1;else sort={key,dir:1};page=1;render()}
function localDateText(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function weekBounds(){const d=new Date(),day=d.getDay(),start=new Date(d);start.setDate(d.getDate()-(day===0?6:day-1));const end=new Date(start);end.setDate(start.getDate()+6);return {start:localDateText(start),end:localDateText(end)}}
function setDashboardView(view){dashboardView=view;page=1;$('filter').value='';document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const titles={today:'오늘 상담 학생',week:'이번 주 상담 학생',pending:'미승인 상담 학생',completed:'완료 상담 학생'};$('listTitle').textContent=titles[view]||'신청 목록';render();document.querySelector('.card .toolbar').scrollIntoView({behavior:'smooth',block:'start'})}
function data(){const f=$('filter').value,today=localDateText(),week=weekBounds();return rows.filter(r=>{if(f&&r.status!==f)return false;if(dashboardView==='today')return r.date===today&&r.status!=='반려';if(dashboardView==='week')return r.date>=week.start&&r.date<=week.end&&r.status!=='반려';if(dashboardView==='pending')return r.status==='대기';if(dashboardView==='completed')return r.status==='완료';return true}).sort((a,b)=>{const av=sort.key==='datetime'?a.date+' '+a.time:String(a[sort.key]||'');const bv=sort.key==='datetime'?b.date+' '+b.time:String(b[sort.key]||'');return av.localeCompare(bv,'ko')*sort.dir})}
function render(){const all=data(),start=(page-1)*size,list=all.slice(start,start+size);$('adminTable').querySelector('tbody').innerHTML=list.map(r=>{const statusHtml=`<div class="status-box"><span class="status ${esc(r.status)}">${esc(r.status)}</span>${r.status==='대기'?`<button class="approve-btn" onclick="changePendingStatus('${r.id}','승인')">승인</button><button class="hold-btn" onclick="changePendingStatus('${r.id}','보류')">보류</button>`:''}</div>`;return `<tr><td data-label="상담일시">${esc(r.date)}<br>${esc(r.time)}</td><td data-label="학생이름">${esc(r.name)}${r.phone?`<br><small>☎ ${esc(r.phone)}</small>`:''}</td><td data-label="학번">${esc(r.studentId)}</td><td data-label="분야">${esc(r.category)}</td><td data-label="상태">${statusHtml}</td><td data-label="신청내용">${esc(r.content)}</td><td data-label="관리"><button onclick="openEdit('${r.id}')">상담 기록</button></td></tr>`}).join('')||'<tr><td data-label="안내" colspan="7">표시할 신청이 없습니다.</td></tr>';const pages=Math.max(1,Math.ceil(all.length/size));if(page>pages){page=pages;return render()}$('pager').innerHTML=`<button ${page===1?'disabled':''} onclick="page--;render()">이전</button><span>${page} / ${pages} (총 ${all.length}명)</span><button ${page===pages?'disabled':''} onclick="page++;render()">다음</button>`}
function openEdit(id){editing=rows.find(r=>r.id===id);$('studentInfo').textContent=`${editing.name} (${editing.studentId})${editing.phone?' · '+editing.phone:''} · ${editing.date} ${editing.time}`;$('editStatus').value=editing.status;$('editResult').value=editing.result;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function changePendingStatus(id,status){const r=rows.find(x=>x.id===id);if(!r||r.status!=='대기')return;if(!confirm(`${r.name} 학생의 상담 신청을 ${status} 상태로 변경할까요?`))return;google.script.run.withSuccessHandler(()=>{alert(`${status} 상태로 변경되었습니다.`);loadData()}).withFailureHandler(e=>alert(e.message)).updateCounseling(token,{id:r.id,status,result:r.result||'',expectedStatus:'대기'})}
function saveEdit(){google.script.run.withSuccessHandler(r=>{alert(r.message);closeModal();loadData()}).withFailureHandler(e=>alert(e.message)).updateCounseling(token,{id:editing.id,status:$('editStatus').value,result:$('editResult').value})}
function renderStats(){
  const fields=['월','전체','진학','취업','진로탐색','학과/전공','진로미결정','기타','완료'];
  document.querySelector('.statsTable thead').innerHTML='<tr>'+fields.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';
  $('statsBody').innerHTML=monthly.map(s=>'<tr>'+fields.map(x=>`<td>${esc(s[x]??0)}</td>`).join('')+'</tr>').join('')||'<tr><td colspan="9">통계가 없습니다.</td></tr>';
}
</script></body></html>
