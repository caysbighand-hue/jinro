
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꿈꾸는 학교 프로그램 신청</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:auto;padding:20px 14px 50px}
.hero{background:#142a4a;color:#fff;border-radius:22px;padding:28px 22px;margin-bottom:16px}
.hero h1{margin:0 0 12px;font-size:28px}
.hero p{margin:6px 0;line-height:1.6}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 15px rgba(20,42,74,.07)}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;padding:14px;border:1px solid #d5dbe5;border-radius:10px;font-size:16px}
.program-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.program{border:1px solid #d5dbe5;border-radius:12px;padding:14px;cursor:pointer}
.program.disabled{opacity:.45;cursor:not-allowed;background:#f3f4f6}
.program input{width:auto;margin-right:7px}
.name{font-weight:700}
.remain{font-size:13px;color:#637083;margin-top:5px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{background:#aab4c3;cursor:not-allowed}
.notice{padding:13px;border-radius:10px;background:#fff6d9;color:#6b5200;line-height:1.5}
.success{background:#e8f7ed;color:#145c2d}
.error{background:#fdebec;color:#8c2029}
.countdown{text-align:center;font-size:19px;font-weight:700;padding:10px}
.small{font-size:13px;color:#6b7483;line-height:1.5}
.hidden{display:none}
.result{font-size:18px;line-height:1.8}
@media(max-width:520px){.program-grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1 id="eventName">꿈꾸는 학교</h1>
    <p id="eventInfo"></p>
    <p>신청 시작: <strong>2026년 9월 11일 오전 8시 30분</strong></p>
  </section>

  <div id="countdown" class="card countdown"></div>
  <div id="message" class="hidden card"></div>

  <section id="applicationSection" class="card">
    <h2>프로그램 신청</h2>
    <p class="small">학생 1명당 1개 프로그램만 신청할 수 있습니다. 선착순으로 마감됩니다.</p>

    <div class="card">
      <label for="studentNumber">학번</label>
      <input id="studentNumber" inputmode="numeric" maxlength="5" placeholder="예: 10101">
      <p class="small">1학년 1반 1번 → 10101</p>
    </div>

    <div class="card">
      <label for="studentName">이름</label>
      <input id="studentName" maxlength="30" placeholder="이름을 입력하세요">
    </div>

    <div class="card">
      <label>프로그램 선택</label>
      <div id="programs" class="program-grid"></div>
    </div>

    <button id="submitBtn" onclick="submitApplication()" disabled>신청하기</button>
  </section>

  <section class="card">
    <h2>내 신청 확인</h2>
    <input id="checkNumber" inputmode="numeric" maxlength="5" placeholder="학번 5자리">
    <br><br>
    <button onclick="findApplication()">신청 내역 확인</button>
    <div id="checkResult" class="result" style="margin-top:15px"></div>
  </section>
</div>

<script>
let appData = null;

function load() {
  google.script.run.withSuccessHandler(render).getPublicData();
}

function render(data) {
  appData = data;
  document.getElementById('eventName').textContent = data.eventName;
  document.getElementById('eventInfo').textContent = data.eventDate + ' · ' + data.eventTime;
  renderPrograms();

  if (!data.isOpen) {
    document.getElementById('submitBtn').disabled = true;
    startCountdown(new Date(data.openAt));
  } else {
    document.getElementById('countdown').innerHTML = '현재 신청 가능합니다.';
    document.getElementById('submitBtn').disabled = false;
  }
}

function renderPrograms() {
  const box = document.getElementById('programs');
  box.innerHTML = '';

  appData.programs.forEach((p, i) => {
    const div = document.createElement('label');
    div.className = 'program' + (p.closed ? ' disabled' : '');
    div.innerHTML =
      '<input type="radio" name="program" value="' + escapeHtml(p.name) + '"' +
      (p.closed ? ' disabled' : '') + '>' +
      '<span class="name">' + escapeHtml(p.name) + '</span>' +
      '<div class="remain">' +
      (p.closed ? '정원 마감' : '잔여 ' + p.remaining + '명 / 정원 ' + p.capacity + '명') +
      '</div>';
    box.appendChild(div);
  });
}

function startCountdown(openAt) {
  const box = document.getElementById('countdown');
  function tick() {
    const diff = openAt.getTime() - Date.now();
    if (diff <= 0) {
      box.innerHTML = '신청 시간이 되었습니다. 신청 정보를 불러오는 중...';
      load();
      return;
    }
    const sec = Math.floor(diff / 1000);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    box.textContent = '신청 시작까지 ' + h + '시간 ' + String(m).padStart(2,'0') + '분 ' + String(s).padStart(2,'0') + '초';
    setTimeout(tick, 1000);
  }
  tick();
}

function submitApplication() {
  const studentNumber = document.getElementById('studentNumber').value.trim();
  const studentName = document.getElementById('studentName').value.trim();
  const selected = document.querySelector('input[name="program"]:checked');

  if (!/^\d{5}$/.test(studentNumber)) {
    showMessage('학번은 5자리 숫자로 입력해 주세요.', 'error');
    return;
  }
  if (!studentName) {
    showMessage('이름을 입력해 주세요.', 'error');
    return;
  }
  if (!selected) {
    showMessage('프로그램을 선택해 주세요.', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '신청 처리 중...';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.ok) {
        showMessage(
          '<strong>신청이 완료되었습니다.</strong><br><br>' +
          '학번: ' + escapeHtml(result.studentNumber) + '<br>' +
          '이름: ' + escapeHtml(result.studentName) + '<br>' +
          '프로그램: <strong>' + escapeHtml(result.program) + '</strong>',
          'success'
        );
        document.getElementById('applicationSection').classList.add('hidden');
        load();
      } else {
        showMessage(result.message, 'error');
        btn.disabled = false;
        btn.textContent = '신청하기';
        load();
      }
    })
    .withFailureHandler(function(err) {
      showMessage('신청 처리 중 오류가 발생했습니다. 다시 시도해 주세요.', 'error');
      btn.disabled = false;
      btn.textContent = '신청하기';
    })
    .submitApplication({
      studentNumber: studentNumber,
      studentName: studentName,
      program: selected.value
    });
}

function findApplication() {
  const number = document.getElementById('checkNumber').value.trim();
  const resultBox = document.getElementById('checkResult');
  resultBox.textContent = '확인 중...';

  google.script.run.withSuccessHandler(function(result) {
    if (result.ok) {
      resultBox.innerHTML =
        '<div class="success card">' +
        '<strong>신청 내역</strong><br>' +
        '학번: ' + escapeHtml(result.studentNumber) + '<br>' +
        '이름: ' + escapeHtml(result.studentName) + '<br>' +
        '프로그램: <strong>' + escapeHtml(result.program) + '</strong>' +
        '</div>';
    } else {
      resultBox.innerHTML = '<div class="error card">' + escapeHtml(result.message) + '</div>';
    }
  }).findMyApplication(number);
}

function showMessage(text, type) {
  const box = document.getElementById('message');
  box.className = 'card ' + type;
  box.innerHTML = text;
  box.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(m) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];
  });
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
