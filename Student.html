<!doctype html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><style>
:root{--n:#173b6c;--b:#2474c6;--bg:#f2f6fb;--r:#c62828;--g:#16703c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Noto Sans KR',sans-serif;color:#172033}.wrap{max-width:680px;margin:auto;padding:20px 14px 50px}header{color:#fff;background:linear-gradient(135deg,var(--n),var(--b));border-radius:18px;padding:26px 22px;box-shadow:0 8px 25px #173b6c33}h1{margin:0;font-size:30px}.card{background:#fff;margin-top:16px;padding:20px;border-radius:16px;box-shadow:0 4px 16px #173b6c14}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}label,.label{display:block;font-weight:800;margin-bottom:7px}input,select,textarea,button{width:100%;font-size:16px;border-radius:10px}input,select,textarea{border:1px solid #b8c4d2;padding:11px;background:#fff}textarea{min-height:125px;resize:vertical}.radios{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.radio{display:flex;align-items:center;gap:7px;padding:10px;border:1px solid #ccd5e0;border-radius:10px}.radio input{width:auto}button{min-height:50px;border:0;background:var(--n);color:#fff;font-weight:900;margin-top:18px;cursor:pointer}button:disabled{background:#9ba6b4}.msg{display:none;margin-top:14px;padding:14px;border-radius:10px;font-weight:700}.ok{display:block;background:#e9f7ef;color:var(--g)}.err{display:block;background:#fff0f0;color:var(--r)}small{color:#5f6976}@media(max-width:480px){.grid,.radios{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><main class="wrap"><header><h1>🎯 나의 진로상담 신청</h1><p>원하는 날짜와 빈 상담시간을 선택하세요.</p></header><section class="card"><form id="applicationForm"><div class="grid"><div><label for="grade">학년</label><select id="grade" required><option value="">선택</option><option>1</option><option>2</option><option>3</option></select></div><div><label for="classNo">반</label><select id="classNo" required><option value="">선택</option></select></div><div><label for="number">번호</label><select id="number" required><option value="">선택</option></select></div><div><label for="name">이름</label><input id="name" maxlength="20" required></div><div style="grid-column:1/-1"><label for="phone">학생 전화번호</label><input id="phone" type="tel" inputmode="tel" maxlength="13" placeholder="010-1234-5678" autocomplete="tel" required><small>상담 일정 확인에 사용할 학생 본인의 전화번호를 입력하세요.</small></div></div><div style="margin-top:17px"><span class="label">상담 분야</span><div id="categories" class="radios"></div></div><div class="grid" style="margin-top:17px"><div><label for="date">희망 상담일</label><input type="date" id="date" required></div><div><label for="time">희망 시간</label><select id="time" required><option value="">날짜를 먼저 선택하세요</option></select></div></div><div style="margin-top:17px"><label for="content">상담받고 싶은 내용을 적어주세요.</label><textarea id="content" maxlength="1000" required></textarea><small>최대 1,000자</small></div><button id="submit" type="submit">상담 신청하기</button><div id="msg" class="msg" role="alert"></div></form></section></main><script>

document.querySelector('main').insertAdjacentHTML('beforeend',`<section class="card"><h2 style="margin-top:0">🔎 나의 상담신청 내역 조회</h2><p><small>신청할 때 사용한 학번과 이름을 정확히 입력하세요.</small></p><div class="grid"><div><label for="lookupId">학번</label><input id="lookupId" inputmode="numeric" maxlength="5" placeholder="예: 10101"></div><div><label for="lookupName">이름</label><input id="lookupName" maxlength="20" placeholder="학생 이름"></div></div><button id="lookupBtn" type="button" onclick="lookup()">신청 내역 확인</button><div id="lookupResult" aria-live="polite"></div></section>`);
function range(id,n){for(let i=1;i<=n;i++)$(id).add(new Option(i,i));}range('classNo',10);range('number',25);
google.script.run.withSuccessHandler(d=>{$('date').min=d.today;$('categories').innerHTML=d.categories.map((x,i)=>`<label class="radio"><input type="radio" name="category" value="${x}" ${i===0?'required':''}> ${x}</label>`).join('');}).getStudentInit();
$('date').addEventListener('change',loadTimes);function loadTimes(){const d=$('date').value;$('time').innerHTML='<option value="">불러오는 중…</option>';google.script.run.withSuccessHandler(renderTimes).withFailureHandler(e=>show(e.message||'시간을 불러오지 못했습니다.',false)).getAvailableTimes(d)}
function renderTimes(arr){$('time').innerHTML='<option value="">선택</option>';arr.forEach(x=>{const o=new Option(x.available?x.time:x.time+' (신청 마감)',x.time);o.disabled=!x.available;$('time').add(o)})}
form.addEventListener('submit',e=>{e.preventDefault();btn.disabled=true;show('신청을 처리하고 있습니다.',true);const checked=document.querySelector('input[name=category]:checked');const p={grade:$('grade').value,classNo:$('classNo').value,number:$('number').value,name:$('name').value,phone:$('phone').value,category:checked?checked.value:'',date:$('date').value,time:$('time').value,content:$('content').value};google.script.run.withSuccessHandler(r=>{btn.disabled=false;show(r.message+(r.id?' 접수번호: '+r.id:''),r.ok);if(r.times)renderTimes(r.times);if(r.ok){form.reset();$('time').innerHTML='<option value="">날짜를 먼저 선택하세요</option>'}}).withFailureHandler(e=>{btn.disabled=false;show(e.message||'오류가 발생했습니다.',false)}).submitCounseling(p)});
function show(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function lookup(){
  const studentId=$('lookupId').value.trim(),name=$('lookupName').value.trim();
  $('lookupBtn').disabled=true;$('lookupResult').innerHTML='<p>신청 내역을 확인하고 있습니다…</p>';
  google.script.run.withSuccessHandler(r=>{
    $('lookupBtn').disabled=false;
    const list=r.rows||[];
    $('lookupResult').innerHTML=`<div class="msg ${r.ok?'ok':'err'}" style="display:block">${safe(r.message)}</div>`+
      list.map(x=>`<article style="border:1px solid #d5dde7;border-radius:12px;padding:14px;margin-top:10px"><strong>${safe(x.date)} ${safe(x.time)}</strong><p style="margin:8px 0">상담 분야: ${safe(x.category)}</p><p style="margin:0">처리 상태: <b>${safe(x.status)}</b> · 접수번호: ${safe(x.id)}</p></article>`).join('');
  }).withFailureHandler(e=>{$('lookupBtn').disabled=false;$('lookupResult').innerHTML=`<div class="msg err" style="display:block">${safe(e.message||'조회 중 오류가 발생했습니다.')}</div>`}).getMyApplications(studentId,name);
}
function safe(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
</script></body></html>
